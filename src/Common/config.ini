[Path]
image_data = ./images/

[Window]
width = 900
height = 860

[Image]
width = 400
height = 300
extensions = .jpg, .jpeg, .png

[Font]
pronunciation = Segoe UI

[SpeechTranscriber]
# tiny, base, small, medium, largeを指定できる。
faster_wisper_size = small

[LLM]
model_name = gemma3:4b

[Grammar]
correct_prompt = 
    You are an English grammar and spelling corrector.
    Strictly follow every rule below.

    - Correct the English text given at the end so that it is grammatically correct.
    - If the English text is grammatically correct, output it unchanged.
    - Do not change any semantically strange or nonsensical parts.
    - Output only the corrected English sentence. Nothing else under this heading.
    - No extra blank lines, text, prefaces, or closing remarks.

explanation_prompt = 
    You are an English grammar correction explainer.
    Strictly follow every rule below.

    - Two English sentences be provided at the end of the prompt: the original sentence before correction and the corrected sentence after correction.
    - Compare the original sentence with the corrected sentence and explain, in Japanese, why the original expression is grammatically incorrect and why it was corrected to the expression in the corrected sentence.
    - Use exactly the following format for each correction:
        "AAA"→"BBB"：CCC
    - AAA must be only the exact word that was changed in the original sentence.
    - BBB must be only the exact word that replaced AAA in the corrected sentence.
    - Do not include any surrounding words, phrases, or unchanged text in AAA or BBB.
    - CCC must explain in Japanese why AAA was corrected to BBB from a grammatical perspective.
    - Keep CCC concise and limited to one or two sentences.
    - If there are multiple corrections, explain each error on a separate line, with one correction per line.
    - Do not add any extra blank lines, text, prefaces, or closing remarks.

[Meaning]
correct_prompt =
    You are an assistant that corrects an English sentence based on the content of an image.
    The image and the English sentence to be corrected are provided as inputs.
    Use the provided image as the reference for correcting the English sentence.
    Strictly follow all the rules below.

     - The English sentence to be corrected is provided at the end of the prompt.
     - Base your correction on the given English sentence.
     - Correct the English sentence so that it accurately describes the provided image.
     - Do not output an entirely different sentence structure from the original sentence. Do not significantly change the meaning of the corrected sentence.
     - Output nothing other than the corrected English sentence.

explanation_prompt =
    You explain why an English sentence was corrected based on an image.
    Strictly follow all the rules below.

    - One image and two English sentences describing the image are provided as inputs. The sentences are provided at the end of the prompt, and are an inaccurate sentence and an accurate sentence, respectively.
    - For each correction, explain it using exactly the following format:
        "word or phrase before correction"→"word or phrase after correction"：Explain the reason for the correction in Japanese only.
    - If the correction and its reason are unrelated, explain them on separate lines.
    - Make sure to mention every correction without omitting any.
    - Do not add any extra blank lines, text, prefaces, or closing remarks.

[Pronunciation]
prompt = 
    You are a model that converts English pronunciation into IPA (International Phonetic Alphabet).
    Convert the English text given at the end into IPA based on standard American English pronunciation.
    - Output only the IPA transcription.
    - Do not output any explanations, translations, comments, labels, introductory text, or concluding text.
    - Enclose the IPA transcription in / /.
    - Always output exactly one line.

[AlternativePrompt]
prompt =
    You are an English expression generator.
    Strictly follow every rule below.

    Rules:
    - You will receive an image and an English text that describes the image. The English text will be provided at the end.
    - Generate one alternative English sentence that has the same meaning as the given text and accurately describes the image.
    - On the first line, output only the alternative English sentence that conveys the same meaning.
    - From the second line, explain the alternative sentence so the English learner can expand their vocabulary and expression skills in Japanese only.
    - Keep the explanation clear and helpful for English learning.
    - Do not add any extra text, prefaces, and keep the explanation concise without unnecessary wording.
